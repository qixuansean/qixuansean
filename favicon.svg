<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .logo-bg { fill: #F7F7F5; }
    .logo-line { stroke: #1A1A1A; fill: none; }
    @media (prefers-color-scheme: dark) {
      .logo-bg { fill: #0F0F0F; }
      .logo-line { stroke: #F5F5F0; }
    }
  </style>

  <!-- 极简圆角底盘 -->
  <rect width="100" height="100" rx="20" class="logo-bg"/>

  <!-- 单线条抽象符号（高级感） -->
  <path class="logo-line"
        d="M 28 38
           C 28 22, 48 18, 58 28
           C 72 40, 72 58, 58 68
           C 46 76, 32 72, 32 58
           C 32 48, 48 52, 58 48
           C 70 44, 74 32, 62 28"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>